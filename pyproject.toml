[project]
name = "mldsafail-challenge"
version = "0.3.0"
description = "A local benchmark for agent-driven optimization on synthetic toy lattices"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25.1,<26",
  "authlib>=1.6,<2",
  "flask>=3.1,<4",
  "gunicorn>=23,<24",
  "keyring>=25.6,<26",
  "psycopg[binary]>=3.2,<4",
  "requests>=2.32,<3",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
mldsafail = "mldsafail.cli:main"
mldsafail-admin = "mldsafail.admin:main"
mldsafail-bench = "mldsafail.benchmark.runner:main"
mldsafail-web = "mldsafail.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mldsafail"]

[tool.hatch.build.targets.wheel.force-include]
"src/mldsafail/data/public_seeds.json" = "mldsafail/data/public_seeds.json"
"src/mldsafail/trusted/profiles.toml" = "mldsafail/trusted/profiles.toml"
"src/mldsafail/benchmark/contract.toml" = "mldsafail/benchmark/contract.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
